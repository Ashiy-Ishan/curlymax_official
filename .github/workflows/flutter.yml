name: Flutter checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'platforms;android-35' 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=DEMO=true
      - uses: actions/upload-artifact@v4
        with:
          name: CURLYmax-demo
          path: build/app/outputs/flutter-apk/app-debug.apk
